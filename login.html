<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="gradient-bg">
    <header class="topbar">
        <div class="topbar-spacer"></div>
        <nav class="nav-links">
            <a href="{{ url_for('login') }}" class="nav-link active">Sign In</a>
            <a href="{{ url_for('register') }}" class="nav-link">Register</a>
        </nav>
    </header>

    <main class="auth-scene">
        <div class="floating-shapes" aria-hidden="true">
            <span class="shape shape-1"></span>
            <span class="shape shape-2"></span>
            <span class="shape shape-3"></span>
            <span class="shape shape-4"></span>
            <span class="shape shape-5"></span>
            <span class="shape shape-6"></span>
            <span class="shape shape-7"></span>
            <span class="shape shape-8"></span>
            <span class="shape shape-9"></span>
            <span class="shape shape-10"></span>
            <span class="shape shape-11"></span>
            <span class="shape shape-12"></span>
            <span class="shape shape-13"></span>
            <span class="shape shape-14"></span>
            <span class="shape shape-15"></span>
            <span class="shape shape-16"></span>
        </div>

        <section class="form-card">
            <h1>Sign In</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>

                <label for="admin_code">Admin code</label>
                <input type="password" id="admin_code" name="admin_code" placeholder="Admin code (optional)">

                <button type="submit">Sign In</button>
            </form>
            <a href="{{ url_for('guest') }}" class="auth-guest-link">Vào chế độ khách</a>
        </section>
    </main>
</body>
</html>
